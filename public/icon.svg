<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f"/>
      <stop offset="100%" stop-color="#19c37d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" />
  
  <!-- Outer subtle circuit glow circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.25" stroke-dasharray="8 12" />
  
  <!-- Central Icon: Styled 'K' with Service & Connect nodes -->
  <g filter="url(#glow)">
    <!-- Vertical stem -->
    <rect x="180" y="140" width="36" height="232" rx="18" fill="url(#accentGrad)" />
    <!-- Diagonal top arm -->
    <path d="M 216 256 L 316 156 A 18 18 0 0 1 342 182 L 256 268 Z" fill="url(#accentGrad)" />
    <!-- Diagonal bottom arm -->
    <path d="M 246 250 L 338 352 A 18 18 0 0 1 312 374 L 216 268 Z" fill="url(#accentGrad)" />
    <!-- Connect Nodes -->
    <circle cx="330" cy="168" r="10" fill="#ffffff" />
    <circle cx="326" cy="362" r="10" fill="#ffffff" />
    <circle cx="198" cy="140" r="10" fill="#ffffff" />
  </g>
</svg>
